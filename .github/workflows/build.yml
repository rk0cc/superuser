name: Demo build
on:
  workflow_dispatch:
  release:
    types:
      - released
jobs:
  build_win:
    name: Windows build
    strategy:
      fail-fast: false
      matrix:
        winarch:
          - windows-latest
          # - windows-11-arm
    runs-on: ${{ matrix.winarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: stable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
      - name: Get dependencies
        working-directory: ./demo
        run: flutter pub upgrade
      - name: Build example
        working-directory: ./demo
        run: flutter build windows --release
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: superuser_demo_windows_${{ runner.arch }}
          path: demo/build/windows/x64/runner/Release/
  build_linux:
    name: Linux build
    strategy:
      fail-fast: false
      matrix:
        ubuntuarch:
          - ubuntu-latest
          # - ubuntu-24.04-arm
    runs-on: ${{ matrix.ubuntuarch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: stable
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.x
      - name: Install tools
        run: sudo apt update && sudo apt install curl git unzip xz-utils zip libglu1-mesa clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev -y
      - name: Get dependencies
        working-directory: ./demo
        run: flutter pub upgrade
      - name: Build example
        run: flutter build linux --release
        working-directory: ./demo
      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: superuser_demo_linux_${{ runner.arch }}
          path: demo/build/linux/x64/release/bundle/
